# Basic security settings
#
# Variables used:
#   username                    - /all.yaml
#   hardening_ufw_allowed_ports - [servers, public_servers].yml
#   hardening_fail2ban_enabled  - [servers, public_servers].yml

- name: Install the firewall and brute-force protection packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - nftables
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# ---------- Firewall ----------
- name: Allow the configured ports through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ hardening_ufw_allowed_ports }}"
  become: true

- name: Block all other incoming traffic and switch firewall on
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  become: true

# ---------- SSH ----------
- name: Install SSH hardened settings
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s # Ensure it does not install broken config
  become: true
  notify: Reload sshd

# ---------- Fail2Ban ----------
- name: Enable and start fail2ban for public_servers
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  become: true
  when: hardening_fail2ban_enabled

- name: Ensure fail2ban is not enabled for internal servers
  ansible.builtin.service:
    name: fail2ban
    state: stopped
    enabled: false
  become: true
  when: not hardening_fail2ban_enabled
