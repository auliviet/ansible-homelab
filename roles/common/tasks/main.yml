# Give every Debian hosts the same baseline
#
# Variables used:
#   username                 - inventory/group_vars/all.yaml
#   timezone                 - inventory/group_vars/all.yaml
#   shared_packages          - inventory/group_vars/all.yaml
#   common_servers_packages  - inventory/group_vars/servers.yaml

- name: Install the shared packages
  ansible.builtin.apt:
    name: "{{ shared_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install the Debian-only packages
  ansible.builtin.apt:
    name: "{{ common_servers_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create the user, add to sudo group and set zsh as its shell
  ansible.builtin.user:
    name: "{{ username }}"
    password: "{{ user_password_hash }}"
    update_password: on_create
    groups: sudo
    append: true
    shell: /usr/bin/zsh
  become: true

- name: Add SSH key to the users
  ansible.posix.authorized_key:
    user: "{{ username }}"
    key: "{{ ssh_public_key }}"
    state: present
  become: true

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"
  become: true

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  become: true

- name: Enable daily automatic security updates
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true
