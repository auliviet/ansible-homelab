# Common variables applied to all hosts
username: auliviet
timezone: Australia/Sydney
shared_packages:
  - curl
  - fzf
  - git
  - htop
  - tmux
  - tree
  - vim
  - zsh

# Password hash from vault.yml
user_password_hash: "{{ vault_user_password_hash }}"

# Dotfiles
dotfiles_repo_url: https://github.com/auliviet/dotfiles.git
dotfiles_dir: "{{ dotfiles_home }}/.dotfiles"
dotfiles_links:
  - .zshrc
  - .gitconfig
  - .vimrc
  - .tmux.conf
