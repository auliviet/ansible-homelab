mac_app_store_apps:
  - 424390742 # Compressor
  - 424389933 # Final CUt Pro
  - 361285480 # Keynote
  - 434290957 # Motion
  - 361304891 # Numbers
  - 361309726 # Pages

dotfiles_home: "/Users/{{ username }}"
dotfiles_iterm_dir: "{{ dotfiles_home }}/Library/Application Support/iTerm2/DynamicProfiles"
dotfiles_vscodium_dir: "{{ dotfiles_home }}/Library/Application Support/VSCodium/user"
dotfiles_vscodium_links:
  - src: vscodium.settings.json
    dest: settings.json
  - src: vscodium.keybindings.json
    dest: keybindings.json
