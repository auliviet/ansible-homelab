mac_dev_packages:
  - ansible
  - ansible-lint
  - nvm
  - python@3.12
  - semgrep

mac_homebrew_casks:
  - affinity
  - blender
  - docker-desktop
  - drawio
  - firefox@developer-edition
  - freecad
  - iterm2
  - proton-drive
  - proton-mail
  - proton-pass
  - protonvpn
  - raspberry-pi-imager
