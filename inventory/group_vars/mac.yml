mac_packages:
  - mas
  - tlrc

mac_dev_packages:
  - ansible
  - ansible-lint
  - nvm
  - python@3.12
  - semgrep

mac_homebrew_casks:
  - affinity
  - blender
  - docker-desktop
  - drawio
  - firefox@developer-edition
  - freecad
  - iterm2
  - proton-drive
  - proton-mail
  - proton-pass
  - protonvpn
  - raspberry-pi-imager
  - sketch
  - transmission
  - utm
  - vlc
  - vscodium

mac_app_store_apps:
  - 424390742 # Compressor
  - 424389933 # Final CUt Pro
  - 361285480 # Keynote
  - 434290957 # Motion
  - 361304891 # Numbers
  - 361309726 # Pages

dotfiles_home: "/Users/{{ username }}"
dotfiles_iterm_dir: "{{ dotfiles_home }}/Library/Application Support/iTerm2/DynamicProfiles"
dotfiles_vscodium_dir: "{{ dotfiles_home }}/Library/Application Support/VSCodium/user"
dotfiles_vscodium_links:
  - src: vscodium.settings.json
    dest: settings.json
  - src: vscodium.keybindings.json
    dest: keybindings.json

macos_defaults_dock:
  - { domain: com.apple.dock, key: largesize, type: float, value: 16 }
  - { domain: com.apple.dock, key: autohide, type: int, value: 0 }
  - { domain: com.apple.dock, key: mineffect, type: string, value: genie }
  - { domain: com.apple.dock, key: show-recents, type: int, value: 0 }

macos_defaults_finder:
  - { domain: com.apple.finder, key: ShowPathbar, type: int, value: 1 }
  - { domain: com.apple.finder, key: ShowStatusBar, type: int, value: 1 }
  - {
      domain: com.apple.finder,
      key: FXArrageGroupViewBy,
      type: string,
      value: Name,
    }
  - {
      domain: com.apple.finder,
      key: FXPreferredViewStyle,
      type: string,
      value: clmv,
    }
